<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HNU Portal - Sign In</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(180deg, #0f1d2e 0%, #172a3f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 36px 28px 28px 28px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        .logo-box {
            width: 68px;
            height: 68px;
            background-color: #1e3a62;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            color: #ffffff;
            font-weight: 800;
            font-size: 20px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(30, 58, 98, 0.2);
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13.5px;
            color: #64748b;
            margin-bottom: 20px;
        }

        .error-box {
            background-color: #fef2f2;
            border-radius: 8px;
            padding: 10px 14px;
            display: none;
            align-items: center;
            gap: 8px;
            color: #dc2626;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: left;
        }

        .error-box i {
            font-size: 14px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #334155;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.field-icon {
            position: absolute;
            left: 14px;
            color: #94a3b8;
            font-size: 14px;
        }

        .input-wrapper i.toggle-pwd {
            position: absolute;
            right: 14px;
            color: #94a3b8;
            font-size: 14px;
            cursor: pointer;
        }

        .input-wrapper input {
            width: 100%;
            padding: 10px 38px 10px 38px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 13.5px;
            color: #1e293b;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-wrapper input:focus {
            border-color: #3b82f6;
        }

        .input-wrapper input::placeholder {
            color: #94a3b8;
        }

        .remember-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 18px;
            margin-bottom: 22px;
            text-align: left;
        }

        .remember-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #1e3a62;
            cursor: pointer;
        }

        .remember-group label {
            font-size: 13px;
            color: #475569;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 8px;
            background-color: #8da2bd;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #1e3a62;
        }

        .footer-text {
            margin-top: 36px;
            font-size: 11.5px;
            color: #64748b;
            line-height: 1.5;
        }

        .footer-text strong {
            display: block;
            color: #475569;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-box">HNU</div>

        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to your student portal</p>

        <div id="errorAlert" class="error-box">
            <i class="fa-regular fa-circle-xmark"></i>
            <span>Invalid username or password</span>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-user field-icon"></i>
                    <input type="text" id="username" placeholder="Enter your username" required autocomplete="off">
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock field-icon"></i>
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <i class="fa-regular fa-eye-slash toggle-pwd" id="togglePassword"></i>
                </div>
            </div>

            <div class="remember-group">
                <input type="checkbox" id="rememberMe" checked>
                <label for="rememberMe">Remember me for 30 days</label>
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <div class="footer-text">
            <strong>Helwan National University</strong>
            Student Information System
        </div>
    </div>

    <script>
        const validId = "932240152";

        // إظهار/إخفاء كلمة المرور
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        // التحقق من تسجيل الدخول
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const userInput = document.getElementById('username').value.trim();
            const errorAlert = document.getElementById('errorAlert');

            if (userInput === validId) {
                errorAlert.style.display = "none";
                alert("Sign in successful!");
                // window.location.href = "transcript.html";
            } else {
                errorAlert.style.display = "flex";
            }
        });
    </script>
</body>
</html>
