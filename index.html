<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-container {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-header h2 {
      margin-bottom: 8px;
      color: #333;
    }

    .login-header p {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
      text-align: right;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #444;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #004085;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #004085;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #002752;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <h2>بوابة الطلاب</h2>
      <p>يرجى إدخال بيانات الحساب لمتابعة الدخول</p>
    </div>

    <!-- يتم إرسال البيانات بشكل آمن إلى الخادم عبر طريقة POST -->
    <form action="/login-endpoint" method="POST">
      <div class="form-group">
        <label for="studentId">كود الطالب</label>
        <input type="text" id="studentId" name="studentId" placeholder="أدخل كود الطالب" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-submit">تسجيل الدخول</button>
    </form>
  </div>

</body>
</html>
