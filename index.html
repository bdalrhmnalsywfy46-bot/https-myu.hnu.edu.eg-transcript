<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Portal Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            color: #fff;
        }

        .login-card h2 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #f8fafc;
        }

        .login-card p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            direction: ltr;
            text-align: center;
        }

        .input-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #0284c7;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #0369a1;
        }

        .error-message {
            color: #f87171;
            font-size: 13px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>تسجيل الدخول</h2>
        <p>أدخل الرقم التعريفي للوصول للمنظومة</p>

        <form id="loginForm">
            <div class="input-group">
                <label for="studentId">الرقم التعريفي (Student ID):</label>
                <input type="text" id="studentId" placeholder="أدخل الرقم التعريفي" required autocomplete="off">
            </div>

            <button type="submit" class="btn-submit">دخول</button>
            <div id="errorMsg" class="error-message">الرقم التعريفي غير صحيح! حاول مرة أخرى.</div>
        </form>
    </div>

    <script>
        const validId = "932240152"; // ID المطلوب

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const inputVal = document.getElementById('studentId').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            if (inputVal === validId) {
                // عند نجاح الدخول يمكنك توجيهه لصفحة النتائج أو البورتال
                alert("تم تسجيل الدخول بنجاح!");
                // window.location.href = "dashboard.html"; 
            } else {
                errorMsg.style.display = "block";
            }
        });
    </script>
</body>
</html>
